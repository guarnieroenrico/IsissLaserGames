<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laser Tag AR – Anteprima PC</title>
<style>
html,body{margin:0;height:100%;background:#070b16;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block}
.pill{background:rgba(10,15,34,.85);border:2px solid rgba(80,130,255,.45);border-radius:999px}
#top{position:fixed;top:16px;left:20px;display:flex;align-items:center;gap:12px}
#top img{width:56px;height:56px;object-fit:contain}
#top h1{margin:0;font-size:22px;letter-spacing:1px;text-transform:uppercase}
#top small{display:block;color:#8da2d8;font-size:12px}
#score{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:8px 22px;font-weight:800;font-size:22px;white-space:nowrap}
.b{color:#2f8bff}.r{color:#ff4d4d}
#cta{position:fixed;top:16px;right:20px;padding:10px 18px;color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:linear-gradient(135deg,#1e90ff,#0056b3);border-radius:999px}
#msg{position:fixed;top:32%;left:50%;transform:translate(-50%,-50%) scale(.8);font-size:clamp(36px,8vw,100px);font-weight:900;text-shadow:0 0 40px currentColor;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#msg.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#belt{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);width:min(440px,86vw);padding:10px 16px;border-color:#2f8bff;background:rgba(8,12,28,.85)}
#belt .row{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:6px}
#bar{height:14px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:#3bff7a;transition:width .2s,background .2s}
#hint{position:fixed;bottom:22px;left:20px;color:#7f8fb8;font-size:12px;line-height:1.5;max-width:260px}
@media(max-width:700px){#hint{display:none}#top h1{font-size:15px}#top img{width:40px;height:40px}}
</style>
</head>
<body>
<div id="top"><img src="logo.png" alt="Logo"><div><h1>Laser Tag AR</h1><small>Anteprima per PC &middot; demo simulata</small></div></div>
<div id="score" class="pill"><span class="b">BLU <span id="sb">0</span></span> &nbsp;·&nbsp; <span class="r"><span id="sr">0</span> ROSSI</span></div>
<a id="cta" href="index.html">Apri il gioco (visore AR)</a>
<div id="msg"></div>
<div id="belt" class="pill"><div class="row"><span>HP <span id="hp">100</span></span><span id="st">Barra di vita come nel visore</span></div><div id="bar"><i id="hpbar"></i></div></div>
<div id="hint">Trascina per ruotare, rotella per lo zoom.<br>Questa è una simulazione: la partita vera si gioca con il visore AR.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b16);
scene.fog = new THREE.Fog(0x070b16, 30, 75);
const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
const rd = new THREE.WebGLRenderer({ antialias: true });
rd.setSize(innerWidth, innerHeight);
rd.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(rd.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x182442, 1));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(6, 14, 5); scene.add(sun);

// Arena
const floor = new THREE.Mesh(new THREE.PlaneGeometry(36, 22), new THREE.MeshStandardMaterial({ color: 0x0e1424, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
scene.add(new THREE.GridHelper(36, 36, 0x2a3a6a, 0x1a2444).translateY(0.01));
const wm = new THREE.MeshStandardMaterial({ color: 0x6b7390, roughness: 0.8 });
const logoTex = new THREE.TextureLoader().load('logo.png');
const logoM = new THREE.MeshBasicMaterial({ map: logoTex, transparent: true, alphaTest: 0.05 });
// k=0 muro BASSO, k=1 muro ALTO: logo su entrambe le facce, senza sfondo nero
[[-4,-3,0],[-4,3,0],[4,-3,0],[4,3,0],[-7,0,1],[7,0,1],[0,-5,0],[0,5,0]].forEach(([x, z, k]) => {
  const d = k ? [1.55, 1.95, 0.6] : [1.4, 1.5, 0.54], ls = k ? 0.98 : 0.84;
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.BoxGeometry(...d), wm); m.position.y = d[1] / 2; g.add(m);
  [1, -1].forEach(sd => {
    const l = new THREE.Mesh(new THREE.PlaneGeometry(ls, ls), logoM);
    l.position.set(0, d[1] * 0.5, sd * (d[2] / 2 + 0.004)); if (sd < 0) l.rotation.y = Math.PI; g.add(l);
  });
  g.position.set(x, 0, z); g.rotation.y = k ? Math.PI / 2 : 0; scene.add(g);
});
function base(x, c) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.15, 32), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.5 })));
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 12, 16, 1, true), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
  beam.position.y = 6; g.add(beam); g.position.set(x, 0.08, 0); scene.add(g);
}
base(-12, 0x2f8bff); base(12, 0xff3b3b);

// Bandiera centrale
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.6, 8), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
pole.position.y = 1.3; scene.add(pole);
const clothG = new THREE.PlaneGeometry(1.4, 0.9, 14, 8); clothG.translate(0.7, 0, 0);
const cloth = new THREE.Mesh(clothG, new THREE.MeshStandardMaterial({ color: 0xb89410, emissive: 0xffd84d, emissiveIntensity: 0.4, side: THREE.DoubleSide }));
cloth.position.set(0.04, 2.1, 0); scene.add(cloth);
const base0 = Float32Array.from(clothG.attributes.position.array);

// Giocatori simulati
const bots = [];
function bot(team, x, z, ph) {
  const c = team ? 0xff4444 : 0x3388ff, g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x1a2030, metalness: 0.8, roughness: 0.4 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.42, 0.18), mat); body.position.y = 1.25;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.24), mat); head.position.y = 1.6;
  const v = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.06), new THREE.MeshBasicMaterial({ color: c })); v.position.set(0, 1.6, -0.12);
  g.add(body, head, v); scene.add(g); bots.push({ g, team, x, z, ph });
}
bot(0, -8, -2, 0); bot(0, -8, 2, 1.7); bot(1, 8, -2, 3.1); bot(1, 8, 2, 4.4);

// Laser ed onde
const lasers = [];
const lm = [0x2f8bff, 0xff3b3b].map(c => new THREE.MeshBasicMaterial({ color: c, blending: THREE.AdditiveBlending }));
for (let i = 0; i < 24; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 1), lm[0]); m.visible = false; scene.add(m); lasers.push({ m, d: new THREE.Vector3(), life: 0 }); }
function fire() {
  const a = bots[Math.floor(Math.random() * 4)];
  const foes = bots.filter(b => b.team !== a.team), t = foes[Math.floor(Math.random() * 2)];
  const l = lasers.find(x => x.life <= 0); if (!l) return;
  const o = a.g.position.clone().setY(1.3), tp = t.g.position.clone().setY(1.2 + Math.random() * 0.3);
  l.d.copy(tp).sub(o).normalize(); l.m.material = lm[a.team]; l.m.position.copy(o);
  l.m.lookAt(o.clone().add(l.d)); l.m.visible = true; l.life = 0.9;
}
const fx = [];
function wave(x, z, c, R) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
  m.position.set(x, 0.06, z); scene.add(m); fx.push({ m, t: 0, R });
}

// Messaggi e HUD
function msg(t, c, s) {
  const e = $('msg'); e.textContent = t; e.style.color = c; e.classList.add('on');
  clearTimeout(msg.h); msg.h = setTimeout(() => e.classList.remove('on'), (s || 1) * 1000);
}
let score = [0, 0], hp = 100;
function ui() {
  $('sb').textContent = score[0]; $('sr').textContent = score[1]; $('hp').textContent = hp;
  const bar = $('hpbar'); bar.style.width = hp + '%';
  bar.style.background = hp > 60 ? '#3bff7a' : hp > 30 ? '#ffd84d' : '#ff3b3b';
}

// Ciclo di demo: conto alla rovescia, partita, vittoria
let phase = 'count', pt = 0, lastN = 4, fireT = 0, capT = 0, hitT = 0, deadT = 0, capN = 0;
function step(dt) {
  pt += dt;
  if (phase === 'count') {
    const n = 3 - Math.floor(pt);
    if (n !== lastN && n >= 1) { lastN = n; msg(n, ['', '#3bff7a', '#ffd84d', '#ff3b3b'][n], 0.8); }
    if (pt >= 3.6) { phase = 'play'; pt = capT = hitT = fireT = 0; msg('PARTITA INIZIATA!', '#ffd84d', 2); wave(0, 0, 0xffd84d, 22); wave(-12, 0, 0x2f8bff, 14); wave(12, 0, 0xff3b3b, 14); }
  } else if (phase === 'play') {
    fireT += dt; capT += dt; hitT += dt;
    if (fireT > 0.45) { fireT = 0; fire(); }
    if (capT > 3.5) {
      capT = 0; const tm = capN++ % 3 === 2 ? 1 : 0; score[tm] += 100;
      wave(0, 0, tm ? 0xff3b3b : 0x2f8bff, 10);
      msg('BANDIERA CONQUISTATA DAI ' + (tm ? 'ROSSI' : 'BLU'), tm ? '#ff4d4d' : '#2f8bff', 2);
      if (score[tm] >= 500) { phase = 'end'; pt = 0; msg(tm ? 'VINCONO I ROSSI!' : 'VINCONO I BLU!', tm ? '#ff4d4d' : '#2f8bff', 4); }
    }
    if (deadT > 0) { deadT -= dt; if (deadT <= 0) { hp = 100; msg('DI NUOVO IN GIOCO!', '#3bff7a', 1.5); } }
    else if (hitT > 1.3) { hitT = 0; hp = Math.max(0, hp - 10); if (hp <= 0) { deadT = 3; msg('ELIMINATO!', '#ff3b3b', 2); } }
    $('st').textContent = deadT > 0 ? 'ELIMINATO · rinasci tra ' + Math.ceil(deadT) + 's' : 'Barra di vita come nel visore';
    ui();
  } else if (pt > 4.5) { phase = 'count'; pt = 0; lastN = 4; score = [0, 0]; hp = 100; capN = 0; deadT = 0; ui(); }
}

// Camera orbitale
let th = 0.6, ph = 0.75, dist = 24, drag = false, idle = 0;
addEventListener('mousedown', () => { drag = true; });
addEventListener('mouseup', () => { drag = false; idle = 0; });
addEventListener('mousemove', e => { if (drag) { th -= e.movementX * 0.006; ph = Math.min(1.45, Math.max(0.15, ph + e.movementY * 0.006)); } });
addEventListener('wheel', e => { dist = Math.min(40, Math.max(8, dist + e.deltaY * 0.02)); });
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); rd.setSize(innerWidth, innerHeight); });

let last = performance.now(); ui();
rd.setAnimationLoop(now => {
  const dt = Math.min(0.06, (now - last) / 1000); last = now; const t = now / 1000;
  step(dt);
  if (!drag) { idle += dt; if (idle > 1) th += dt * 0.12; }
  cam.position.set(Math.sin(th) * Math.cos(ph) * dist, Math.sin(ph) * dist, Math.cos(th) * Math.cos(ph) * dist);
  cam.lookAt(0, 1, 0);
  bots.forEach(b => {
    const x = b.x + Math.sin(t * 0.6 + b.ph) * 3, z = b.z + Math.cos(t * 0.5 + b.ph) * 2.5;
    b.g.position.set(x, 0, z); b.g.lookAt(b.team ? -20 : 20, 0, 0);
  });
  const p = cloth.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) { const u = base0[i * 3] / 1.4; p.array[i * 3 + 2] = Math.sin(u * 7 - t * 5) * u * 0.14; }
  p.needsUpdate = true;
  lasers.forEach(l => { if (l.life > 0) { l.m.position.addScaledVector(l.d, 28 * dt); l.life -= dt; if (l.life <= 0) l.m.visible = false; } });
  for (let i = fx.length - 1; i >= 0; i--) {
    const e = fx[i]; e.t += dt / 1.1;
    if (e.t >= 1) { scene.remove(e.m); e.m.geometry.dispose(); e.m.material.dispose(); fx.splice(i, 1); continue; }
    e.m.scale.setScalar(1 + e.t * e.R); e.m.material.opacity = 0.9 * (1 - e.t);
  }
  rd.render(scene, cam);
});
</script>
</body>
</html>
